# `convex deploy` nahraje schéma + funkce do produkčního Convexu (čte
# CONVEX_DEPLOY_KEY z env), vygeneruje reálné `convex/_generated/*` a pak
# spustí `npm run build` s NEXT_PUBLIC_CONVEX_URL nastaveným na URL té
# produkční deployment. Vyžaduje CONVEX_DEPLOY_KEY v Netlify env.
[build]
  # Když je CONVEX_DEPLOY_KEY nastavený, nasadíme Convex funkce a build
  # proběhne s auto-injektnutým NEXT_PUBLIC_CONVEX_URL (datová vrstva
  # aktivní). Bez klíče jen běžný build — web běží dál, formulář
  # doručuje přes Resend. Fallback brání rozbití buildu, než je klíč nastaven.
  command = "if [ -n \"$CONVEX_DEPLOY_KEY\" ]; then npx convex deploy --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL --cmd 'npm run build'; else npm run build; fi"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# ---------- 301 redirects for old WordPress URLs ----------
